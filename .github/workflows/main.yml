name: Kernel Build via Script with Cached Neutron Clang

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache Neutron Clang Toolchain
      uses: actions/cache@v4
      with:
        path: ~/toolchains/neutron-clang
        key: neutron-clang-${{ runner.os }}
        restore-keys: |
          neutron-clang-

    - name: Cache .requirements marker (optional)
      uses: actions/cache@v4
      with:
        path: .requirements
        key: requirements-installed-${{ runner.os }}
        restore-keys: |
          requirements-installed-

    - name: Make build.sh executable
      run: chmod +x build.sh

    - name: Run build script
      run: |
        ./build.sh
  
        FULL_PATH=$(find . -maxdepth 1 -name "PigguVerse-*.zip" -print -quit)
        
        ACTUAL_NAME=$(basename "$FULL_PATH")
        
        echo "zip_filename=$ACTUAL_NAME" >> $GITHUB_OUTPUT
    - name: Upload built Image
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.build_kernel.outputs.zip_filename }}
        path: PigguVerse-*

- name: Send Success Telegram Notification 🟢
      if: success()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        WORKFLOW_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        
        MESSAGE_TEXT="✅ *Kernel Build Successful!*
        [View Workflow Run]($WORKFLOW_URL)"
        
        curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
          -F chat_id="$TELEGRAM_CHAT_ID" \
          -F text="$MESSAGE_TEXT" \
          -F "parse_mode=markdown"

    - name: Send Failure Telegram Notification 🔴
      if: failure()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        WORKFLOW_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        
        MESSAGE_TEXT="❌ *Kernel Build Failed!*
        [View Workflow Run]($WORKFLOW_URL)"
        
        curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
          -F chat_id="$TELEGRAM_CHAT_ID" \
          -F text="$MESSAGE_TEXT" \
          -F "parse_mode=markdown"
